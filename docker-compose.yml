version: "3.9"

# Single service. There is no database: the API serves the model artifacts that
# ml/ writes offline, plus an in-memory dispute store. The Postgres/pgvector
# service that used to live here was never read by any code path.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshak-backend
    environment:
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_MODE: ${RAZORPAY_MODE:-simulated}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Read-only: the container serves artifacts, it never writes them.
      - ./artifacts:/artifacts:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
