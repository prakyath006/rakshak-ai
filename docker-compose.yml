version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rakshak-db
    environment:
      POSTGRES_USER: rakshak
      POSTGRES_PASSWORD: rakshak_dev
      POSTGRES_DB: rakshak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshak-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rakshak:rakshak_dev@db:5432/rakshak
      DATABASE_URL_SYNC: postgresql://rakshak:rakshak_dev@db:5432/rakshak
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
